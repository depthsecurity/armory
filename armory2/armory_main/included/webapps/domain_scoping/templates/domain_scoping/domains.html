{% for domain in domains %}
<div id="domain-{{ domain.id }}-item" class="grid grid-cols-12 items-center gap-3 rounded-lg bg-slate-50 px-3 py-2 dark:bg-slate-800/50">
  <div class="col-span-1"></div>
  <div class="col-span-4">
    <p class="truncate text-sm text-slate-700 dark:text-slate-300">{{ domain.name }}</p>
  </div>
  <div class="col-span-1 text-center">
    {% if domain.ip_addresses.all %}
    <button type="button" class="btn btn-secondary px-2 py-1 text-xs loadips whitespace-nowrap"
            id="button-ips-{{ domain.id }}">
      IPs ({{ domain.ip_addresses.all|length }})
    </button>
    {% endif %}
  </div>
  <div class="col-span-1 text-center">
    <input type="checkbox" class="changescope h-4 w-4 cursor-pointer accent-brand-600"
           id="domain-active-{{ domain.id }}" {% if domain.active_scope %}checked{% endif %}>
  </div>
  <div class="col-span-1 text-center">
    <input type="checkbox" class="changescope h-4 w-4 cursor-pointer accent-brand-600"
           id="domain-passive-{{ domain.id }}" {% if domain.passive_scope %}checked{% endif %}>
  </div>
</div>
<div id="ips-{{ domain.id }}-list" class="mt-1 space-y-1 empty:mt-0"></div>
{% endfor %}
