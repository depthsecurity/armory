<div id="bd-{{ bd.id }}-item" class="mb-2">
  <div class="armory-card">
    <div class="armory-card-body">
      <div class="grid grid-cols-12 items-center gap-3">
        <div class="col-span-4">
          <p class="truncate text-sm font-medium text-slate-800 dark:text-slate-200"
             title="{{ bd.meta.whois }}">{{ bd.name }}</p>
        </div>
        <div class="col-span-1 text-center">
          {% if bd.domain_set.all %}
          <button type="button" class="btn btn-secondary px-2 py-1 text-xs loaddomains whitespace-nowrap"
                  href="{% url 'domain_scoping.get_domains' bd.id %}" id="button-domains-{{ bd.id }}">
            Domains
          </button>
          {% endif %}
        </div>
        <div class="col-span-1 text-center">
          <input type="checkbox" class="changescope h-4 w-4 cursor-pointer accent-brand-600"
                 id="bd-active-{{ bd.id }}" {% if bd.active_scope %}checked{% endif %}>
        </div>
        <div class="col-span-1 text-center">
          <input type="checkbox" class="changescope h-4 w-4 cursor-pointer accent-brand-600"
                 id="bd-passive-{{ bd.id }}" {% if bd.passive_scope %}checked{% endif %}>
        </div>
        <div class="col-span-1 text-center">
          <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-clear-active-{{ bd.id }}"
                  title="Clears all active scoping for this item and all child items">Clear</button>
        </div>
        <div class="col-span-1 text-center">
          <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-set-active-{{ bd.id }}"
                  title="Sets all active scoping for this item and all child items">Set</button>
        </div>
        <div class="col-span-1 text-center">
          <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-clear-passive-{{ bd.id }}"
                  title="Clears all passive scoping for this item and all child items">Clear</button>
        </div>
        <div class="col-span-1 text-center">
          <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-set-passive-{{ bd.id }}"
                  title="Sets all passive scoping for this item and all child items">Set</button>
        </div>
        <div class="col-span-1 text-center">
          <button class="btn btn-primary px-2 py-1 text-xs deletedomain" id="bd-delete-{{ bd.id }}"
                  title="Delete the domain, subdomains, and associated IPs and CIDRs">Delete</button>
        </div>
      </div>
      <div id="domains-{{ bd.id }}-list" class="mt-3 space-y-2 empty:mt-0"></div>
    </div>
  </div>
</div>
