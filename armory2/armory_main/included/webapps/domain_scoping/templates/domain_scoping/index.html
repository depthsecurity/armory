{% extends 'armory_main/base_tw.html' %}
{% load static %}

{% block extra_head %}
<script src="{% static 'armory_main/js/jquery-3.5.1.min.js' %}"></script>
{% endblock %}

{% block content %}
<div class="armory-container py-4">
  <!-- Header row with column labels -->
  <div class="armory-card mb-4">
    <div class="armory-card-body">
      <div class="grid grid-cols-12 items-center gap-3 text-sm font-semibold text-slate-500 dark:text-slate-400">
        <div class="col-span-4">Domain</div>
        <div class="col-span-1"></div>
        <div class="col-span-1 text-center">Active</div>
        <div class="col-span-1 text-center">Passive</div>
        <div class="col-span-1 text-center" title="Clear/Set active scope for all children">Active</div>
        <div class="col-span-1 text-center"></div>
        <div class="col-span-1 text-center" title="Clear/Set passive scope for all children">Passive</div>
        <div class="col-span-1 text-center"></div>
        <div class="col-span-1 text-center">Delete</div>
      </div>
    </div>
  </div>

  {% for bd in basedomains %}
  <div id="bd-{{ bd.id }}-item" class="mb-2">
    <div class="armory-card">
      <div class="armory-card-body">
        <div class="grid grid-cols-12 items-center gap-3">
          <div class="col-span-4">
            <p class="truncate text-sm font-medium text-slate-800 dark:text-slate-200"
               title="{{ bd.meta.whois }}">{{ bd.name }}</p>
          </div>
          <div class="col-span-1 text-center">
            {% if bd.domain_set.all %}
            <button type="button" class="btn btn-secondary px-2 py-1 text-xs loaddomains whitespace-nowrap"
                    href="{% url 'domain_scoping.get_domains' bd.id %}" id="button-domains-{{ bd.id }}">
              Domains
            </button>
            {% endif %}
          </div>
          <div class="col-span-1 text-center">
            <input type="checkbox" class="changescope h-4 w-4 cursor-pointer accent-brand-600"
                   id="bd-active-{{ bd.id }}" {% if bd.active_scope %}checked{% endif %}>
          </div>
          <div class="col-span-1 text-center">
            <input type="checkbox" class="changescope h-4 w-4 cursor-pointer accent-brand-600"
                   id="bd-passive-{{ bd.id }}" {% if bd.passive_scope %}checked{% endif %}>
          </div>
          <div class="col-span-1 text-center">
            <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-clear-active-{{ bd.id }}"
                    title="Clears all active scoping for this item and all child items">Clear</button>
          </div>
          <div class="col-span-1 text-center">
            <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-set-active-{{ bd.id }}"
                    title="Sets all active scoping for this item and all child items">Set</button>
          </div>
          <div class="col-span-1 text-center">
            <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-clear-passive-{{ bd.id }}"
                    title="Clears all passive scoping for this item and all child items">Clear</button>
          </div>
          <div class="col-span-1 text-center">
            <button class="btn btn-secondary px-2 py-1 text-xs clearscope" id="bd-set-passive-{{ bd.id }}"
                    title="Sets all passive scoping for this item and all child items">Set</button>
          </div>
          <div class="col-span-1 text-center">
            <button class="btn btn-primary px-2 py-1 text-xs deletedomain" id="bd-delete-{{ bd.id }}"
                    title="Delete the domain, subdomains, and associated IPs and CIDRs">Delete</button>
          </div>
        </div>
        <div id="domains-{{ bd.id }}-list" class="mt-3 space-y-2 empty:mt-0"></div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

<script>
$(document).on('change', '.changescope', function(e){
  var pkid = e.target.id.split('-')[2];
  var t = e.target.id.split('-')[0];
  var s = e.target.id.split('-')[1];
  $.get('change_scope/' + t + '/' + s + '/' + pkid, { }, function(result) {});
})

$(document).on('click', '.clearscope', function(e){
  var pkid = e.target.id.split('-')[3];
  var t = e.target.id.split('-')[0];
  var s = e.target.id.split('-')[2];
  var act = e.target.id.split('-')[1];
  if ( confirm('Are you sure you want to ' + act + ' ' + s + ' scoping on all of the child objects?' )) {
    $.get('clear_scope/' + act + '/' + t + '/' + s + '/' + pkid, { }, function(result) {
      if ( t == 'bd') {
        $( '#bd-' + pkid + '-item' ).html(result);
      } else {
        $( '#domain-' + pkid + '-item').html(result);
      }
    });
  };
})

$(document).on('click', '.deletedomain', function(e){
  var pkid = e.target.id.split('-')[2];
  if ( confirm('Are you sure you want to delete the domain, subdomain, and child IPs/CIDRs that are not associated with anything else?' )) {
    $.get('delete_domain/' + pkid, { }, function(result) {
      $( '#bd-' + pkid + '-item' ).html("");
    });
  };
})

$(document).on('click','.loadips',function(e){
  var id = e.target.id;
  var i = id.split('-')[2];
  var dest = "get_ips/" + i;
  d = $( '#ips-' + i + '-list');
  if (d.is(':empty') ) {
    $.get(dest, { }, function(result) { d.html(result); });
  } else {
    d.html("");
  }
  return false;
});

$(document).on('click','.loaddomains',function(e){
  var id = e.target.id;
  var i = id.split('-')[2];
  var dest = "get_domains/" + i;
  d = $( '#domains-' + i + '-list');
  if (d.is(':empty') ) {
    $.get(dest, { }, function(result) { d.html(result); });
  } else {
    d.html("");
  }
  return false;
});
</script>
{% endblock %}
