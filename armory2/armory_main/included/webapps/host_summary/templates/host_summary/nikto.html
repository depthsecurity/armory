<div class="px-3 py-3">
  <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 px-1">Nikto Results</div>
  <div class="flex flex-col gap-1">
  {% for name, output in data.items %}
    <div>
      <button type="button" onclick="toggleSection('nk-{{ output.id }}')"
              class="w-full text-left px-3 py-1.5 rounded text-xs font-medium bg-cyan-100 dark:bg-cyan-900 hover:bg-cyan-200 dark:hover:bg-cyan-800 text-cyan-800 dark:text-cyan-200 transition-colors">
        {{ name }}
      </button>
      <div id="nk-{{ output.id }}" class="hidden mt-1 rounded bg-slate-100/40 dark:bg-slate-700/40 border border-slate-200 dark:border-slate-700">
        <pre class="px-3 py-2 text-slate-700 dark:text-slate-300 whitespace-pre-wrap break-words font-mono text-xs">{{ output.text|escape }}</pre>
      </div>
    </div>
  {% empty %}
  <p class="text-xs text-slate-400 dark:text-slate-600 px-1 italic">No Nikto data.</p>
  {% endfor %}
  </div>
</div>
