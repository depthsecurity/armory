{% comment %}
Active/passive scope toggle badges.
Context: obj_type ('domain'|'vhost'), ident, name (vhost only), active_scope, passive_scope
Each badge POSTs a toggle and swaps this whole span with the re-rendered result.
{% endcomment %}
<span class="scope-controls inline-flex items-center gap-1">
  <button type="button" title="Toggle active scope"
          hx-post="/host_summary/scope/{{ obj_type }}/{{ ident }}/active"
          {% if name %}hx-vals='{"name": "{{ name|escapejs }}"}'{% endif %}
          hx-target="closest .scope-controls" hx-swap="outerHTML"
          class="px-1.5 py-0.5 rounded text-[10px] font-bold leading-none border transition-colors {% if active_scope %}bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300 border-green-300 dark:border-green-700/50{% else %}bg-slate-100 dark:bg-slate-700/40 text-slate-400 dark:text-slate-500 border-slate-300 dark:border-slate-600 hover:border-green-400 dark:hover:border-green-600{% endif %}">A</button>
  <button type="button" title="Toggle passive scope"
          hx-post="/host_summary/scope/{{ obj_type }}/{{ ident }}/passive"
          {% if name %}hx-vals='{"name": "{{ name|escapejs }}"}'{% endif %}
          hx-target="closest .scope-controls" hx-swap="outerHTML"
          class="px-1.5 py-0.5 rounded text-[10px] font-bold leading-none border transition-colors {% if passive_scope %}bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 border-blue-300 dark:border-blue-700/50{% else %}bg-slate-100 dark:bg-slate-700/40 text-slate-400 dark:text-slate-500 border-slate-300 dark:border-slate-600 hover:border-blue-400 dark:hover:border-blue-600{% endif %}">P</button>
</span>
