<!-- Delete confirmation modal -->
<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"
     onclick="if(event.target===this){document.getElementById('modal-container').innerHTML=''}">

  <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-2xl w-full max-w-sm"
       onclick="event.stopPropagation()">

    <div class="px-6 py-4 border-b border-gray-700">
      <h3 class="text-base font-semibold text-white">Delete {{ cfg.label }}</h3>
    </div>

    <div class="px-6 py-5 space-y-3">
      <p class="text-sm text-gray-300">
        Are you sure you want to delete this {{ cfg.label|lower }}?
      </p>
      <div class="bg-gray-900 rounded-lg px-4 py-2.5 border border-gray-700">
        <span class="text-gray-200 text-sm font-mono break-all">{{ obj }}</span>
      </div>
      <p class="text-xs text-amber-400">
        This cannot be undone. Related records may be deleted by cascade.
      </p>
    </div>

    <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-700">
      <button type="button"
              onclick="document.getElementById('modal-container').innerHTML=''"
              class="btn btn-ghost text-sm">
        Cancel
      </button>
      <form hx-post="/data_manager/{{ model_key }}/{{ obj_id }}/delete"
            hx-target="#modal-container"
            hx-swap="innerHTML">
        {% csrf_token %}
        <button type="submit"
                class="btn text-sm bg-red-700 hover:bg-red-600 text-white border-red-600">
          Delete
        </button>
      </form>
    </div>

  </div>
</div>
