<div class="space-y-4">
  <h2 class="armory-section-title">{{ module }}</h2>
  <div class="armory-card">
    <div class="armory-card-body">
      <div class="grid grid-cols-12 gap-3 text-xs font-semibold text-slate-500 dark:text-slate-400 pb-2 border-b border-slate-200 dark:border-slate-700 mb-2">
        <div class="col-span-1">On</div>
        <div class="col-span-3">Option</div>
        <div class="col-span-3">Value</div>
        <div class="col-span-5">Help</div>
      </div>
      <form method="post" id="launch_module" action="launch_module/">
        <input type="hidden" name="module" value="{{ module }}"/>
        {% for option, data in options.items %}
        <div class="grid grid-cols-12 gap-3 items-center py-1.5 border-b border-slate-100 dark:border-slate-800">
          <div class="col-span-1">
            {% if data.default %}
            <input type="checkbox" name="cb_{{ option }}" checked="true" class="h-4 w-4 cursor-pointer accent-brand-600">
            {% else %}
            <input type="checkbox" name="cb_{{ option }}" class="h-4 w-4 cursor-pointer accent-brand-600">
            {% endif %}
          </div>
          <div class="col-span-3 text-sm text-slate-700 dark:text-slate-300">{{ option }}</div>
          <div class="col-span-3">
            {% if data.type != 'bool' %}
              {% if data.default %}
              <input type="text" value="{{ data.default }}" name="{{ option }}_value" class="armory-input w-full text-sm">
              {% else %}
              <input type="text" value="" name="{{ option }}_value" class="armory-input w-full text-sm">
              {% endif %}
            {% endif %}
          </div>
          <div class="col-span-5 text-xs text-slate-500 dark:text-slate-400">{{ data.help }}</div>
        </div>
        {% endfor %}
        <div class="flex justify-end pt-3">
          <input type="submit" value="Launch Module" class="btn btn-primary px-4 py-1.5 cursor-pointer"/>
        </div>
      </form>
    </div>
  </div>
</div>
