{% extends 'armory_main/base_tw.html' %}
{% load static %}

{% block extra_head %}
<script src="{% static 'armory_main/js/jquery-3.5.1.min.js' %}"></script>
{% endblock %}

{% block content %}
<div class="armory-container py-4 space-y-6">

  <!-- Tasks card -->
  <div class="armory-card">
    <div class="armory-card-body">
      <h2 class="armory-section-title mb-4">Tasks</h2>
      <div class="flex gap-3 mb-4">
        <button class="btn btn-secondary px-3 py-1.5 text-sm" href="#" onclick="loadactive()">Active</button>
        <button class="btn btn-ghost px-3 py-1.5 text-sm" href="#" onclick="loadinactive()">Inactive</button>
      </div>
      <div id="tasks_div"></div>
    </div>
  </div>

  <!-- Launch card -->
  <div class="armory-card">
    <div class="armory-card-body">
      <h2 class="armory-section-title mb-4">Launch New Job</h2>
      <div class="flex items-center gap-3">
        <label class="text-sm text-slate-600 dark:text-slate-400">Module:</label>
        <select id="moduleSelect" class="armory-input w-64">
          <option value="">— select a module —</option>
          {% for module in all_modules %}
          <option value="{{ module }}">{{ module }}</option>
          {% endfor %}
        </select>
      </div>
      <div id="module_options" class="mt-4"></div>
    </div>
  </div>

  <div id="host_results"></div>
</div>

<script>
    function loadactive() {
      $('#tasks_div').load('get_active_tasks/');
    }
    loadactive();
    function loadinactive() {
      $('#tasks_div').load('get_inactive_tasks/');
    }

    $('#moduleSelect').on('change', function() {
      var module_id = $(this).val();
      if (!module_id) return;
      $.ajax({
        method: "get",
        url: "get_module_options/" + module_id + '/',
        success: function(res) {
          $('#module_options').html(res);
        }
      });
    });

    $(document).on('click', '.modbutton', function(e) {
      var form = $('#search_form');
      var data = form.serialize();
      $.ajax({
        method:"post", url:"host_data", data: data, dataType: "json",
        beforeSend:function() { $('#host_results').html("<h1>Loading data, please wait...</h1>"); },
        success:function(json){ $('#host_results').html(json.hostdata); $('#sidebar_results').html(json.sidebardata); }
      })
      return false;
    });

    $(document).on('click','.loadunload',function(e){
      e.preventDefault();
      id = e.target.id;
      dest = e.target.href;
      var n = id.split('-')[1];
      var i = id.split('-')[2];
      d = $( '#' + n + '-' + i );
      if (d.is(':empty') ) { d.load(dest); } else { d.html(""); }
      return false;
    });
</script>
{% endblock %}
