<div class="grid grid-cols-12 gap-3 text-xs font-semibold text-slate-500 dark:text-slate-400 pb-2 border-b border-slate-200 dark:border-slate-700 mb-2">
  <div class="col-span-4">Code Name</div>
  <div class="col-span-2">Module</div>
  <div class="col-span-2">Started</div>
  <div class="col-span-2">Running For</div>
  <div class="col-span-2">Log File</div>
</div>
{% for task in tasks %}
<div class="grid grid-cols-12 gap-3 items-center py-2 border-b border-slate-100 dark:border-slate-800 text-sm">
  <div class="col-span-4 text-slate-800 dark:text-slate-200">{{ task.code_name }}</div>
  <div class="col-span-2 text-slate-600 dark:text-slate-400">{{ task.module }}</div>
  <div class="col-span-2 text-slate-600 dark:text-slate-400">{{ task.started }}</div>
  <div class="col-span-2 text-slate-600 dark:text-slate-400">{{ task.length }}</div>
  <div class="col-span-2">
    <a href="show_log/{{ task.id }}" target="_blank"
       class="text-brand-600 hover:underline dark:text-brand-400 text-xs font-mono">{{ task.log_file }}</a>
  </div>
</div>
{% endfor %}
